<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows of Bramblewick</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23221d15%27/%3E%3Cpath d=%27M16 4l3 9h9l-7 5 3 10-8-6-8 6 3-10-7-5h9z%27 fill=%27%23d9b45a%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Main menu -->
  <div id="menu" class="screen">
    <div class="title-block">
      <h1>Shadows of Bramblewick</h1>
      <p class="subtitle">A tale of steel and sorcery</p>
    </div>
    <div class="menu-buttons">
      <button id="btn-new">New Game</button>
      <button id="btn-load">Load Game</button>
      <button id="btn-help-menu">How to Play</button>
    </div>
    <p id="save-info" class="save-info"></p>
    <p id="loading" class="save-info"></p>
  </div>

  <!-- Character creation -->
  <div id="create" class="screen hidden">
    <div class="create-box">
      <h2>Create Your Character</h2>
      <div class="create-grid">
        <div class="create-col">
          <label>Name <input id="cc-name" type="text" maxlength="20" value="Aveline"></label>
          <label>Outfit color <input id="cc-color" type="color" value="#b03030"></label>
          <div class="card-list" id="cc-gender"><div class="card selected" data-g="m">Male</div><div class="card" data-g="f">Female</div></div>
          <h3>Race</h3>
          <div id="cc-races" class="card-list"></div>
          <h3>Class</h3>
          <div id="cc-classes" class="card-list"></div>
        </div>
        <div class="create-col">
          <h3>Abilities <span id="cc-points" class="muted"></span></h3>
          <table id="cc-abilities" class="stat-table"></table>
          <h3>Skills <span id="cc-skillpoints" class="muted"></span></h3>
          <table id="cc-skills" class="stat-table"></table>
        </div>
        <div class="create-col">
          <h3>Summary</h3>
          <div id="cc-summary" class="summary"></div>
          <h3>Description</h3>
          <div id="cc-desc" class="desc"></div>
        </div>
      </div>
      <div class="create-actions">
        <button id="cc-back">Back</button>
        <button id="cc-start" class="primary">Begin Adventure</button>
      </div>
    </div>
  </div>

  <!-- In-game UI -->
  <div id="game-ui" class="hidden">
    <div id="hud">
      <div id="hud-player" class="hud-card">
        <div class="portrait" id="hud-portrait"></div>
        <div class="hud-info">
          <div class="hud-name" id="hud-name"></div>
          <div class="hud-sub" id="hud-sub"></div>
          <div class="bar hp"><div id="hud-hp" class="fill"></div><span id="hud-hp-text"></span></div>
          <div class="bar xp"><div id="hud-xp" class="fill"></div><span id="hud-xp-text"></span></div>
        </div>
      </div>
      <div id="hud-hench" class="hud-card hidden">
        <div class="portrait small" id="hench-portrait"></div>
        <div class="hud-info">
          <div class="hud-name" id="hench-name"></div>
          <div class="bar hp"><div id="hench-hp" class="fill"></div><span id="hench-hp-text"></span></div>
        </div>
      </div>
      <div id="hud-effects"></div>
    </div>

    <div id="topright">
      <canvas id="minimap" width="200" height="130"></canvas>
      <div id="area-name"></div>
      <div id="clock"></div>
      <div id="paused" class="hidden">PAUSED</div>
      <div id="targeting" class="hidden"></div>
    </div>

    <div id="log"></div>

    <div id="bottombar">
      <div id="quickbar"></div>
      <div id="menubar">
        <button data-panel="character" title="Character (C)">Character</button>
        <button data-panel="inventory" title="Inventory (I)">Inventory</button>
        <button data-panel="spells" title="Spellbook (B)">Spells</button>
        <button data-panel="journal" title="Journal (J)">Journal</button>
        <button id="btn-rest" title="Rest (R)">Rest</button>
        <button id="btn-pause" title="Pause (Space)">Pause</button>
        <button id="btn-save" title="Save (F5)">Save</button>
        <button id="btn-loadgame" title="Load (F9)">Load</button>
        <button data-panel="help" title="Help (H)">?</button>
      </div>
    </div>

    <div id="panel" class="panel hidden">
      <div class="panel-header"><span id="panel-title"></span><button id="panel-close">×</button></div>
      <div id="panel-body" class="panel-body"></div>
    </div>

    <div id="dialogue" class="dialogue hidden">
      <div class="dlg-name" id="dlg-name"></div>
      <div class="dlg-text" id="dlg-text"></div>
      <div class="dlg-options" id="dlg-options"></div>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <div class="panel-header"><span id="modal-title"></span><button id="modal-close">×</button></div>
        <div id="modal-body" class="panel-body"></div>
      </div>
    </div>

    <div id="banner" class="hidden"></div>
    <div id="fade" class="hidden"></div>
    <div id="tooltip" class="hidden"></div>
  </div>

  <div id="endscreen" class="screen hidden">
    <h1 id="end-title"></h1>
    <p id="end-text"></p>
    <div class="menu-buttons">
      <button id="end-load">Load Last Save</button>
      <button id="end-menu">Main Menu</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
